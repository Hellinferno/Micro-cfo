name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: microcfo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
      UV_LINK_MODE: copy
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: microcfo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio flake8

    - name: Verify database connection and create test database
      env:
        PGPASSWORD: postgres
      run: |
        # Wait for postgres to be ready
        for i in {1..30}; do pg_isready -U postgres -h localhost && break || sleep 1; done
        # Create additional test database if needed
        psql -U postgres -h localhost -d postgres -c "SELECT 1 FROM pg_database WHERE datname='microcfo'" | grep -q 1 || psql -U postgres -h localhost -d postgres -c "CREATE DATABASE microcfo;"
        psql -U postgres -h localhost -d postgres -c "SELECT 1 FROM pg_database WHERE datname='microcfo_test'" | grep -q 1 || psql -U postgres -h localhost -d postgres -c "CREATE DATABASE microcfo_test;"

    - name: Initialize database schema
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
        ENCRYPTION_KEY: _-8xLJH6cfMDh-K8dkR7z-vDiFpnWCYpqGAKW2EIOFg=
      run: |
        alembic -c config/alembic.ini upgrade head
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
        REDIS_URL: redis://localhost:6379/0
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        JWT_SECRET_KEY: test_jwt_secret_key_for_ci_testing_only
        ENCRYPTION_KEY: _-8xLJH6cfMDh-K8dkR7z-vDiFpnWCYpqGAKW2EIOFg=
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      POSTGRES_DB: microcfo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
      UV_LINK_MODE: copy
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: microcfo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Verify database connection
      env:
        PGPASSWORD: postgres
      run: |
        # Wait for postgres to be ready
        for i in {1..30}; do pg_isready -U postgres -h localhost && break || sleep 1; done
        # Verify database exists
        psql -U postgres -h localhost -d postgres -c "SELECT 1 FROM pg_database WHERE datname='microcfo'" | grep -q 1 || psql -U postgres -h localhost -d postgres -c "CREATE DATABASE microcfo;"

    - name: Initialize database schema
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
        ENCRYPTION_KEY: _-8xLJH6cfMDh-K8dkR7z-vDiFpnWCYpqGAKW2EIOFg=
      run: |
        alembic -c config/alembic.ini upgrade head
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/microcfo
        REDIS_URL: redis://localhost:6379/0
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        JWT_SECRET_KEY: test_jwt_secret_key_for_ci_testing_only
        ENCRYPTION_KEY: _-8xLJH6cfMDh-K8dkR7z-vDiFpnWCYpqGAKW2EIOFg=
      run: |
        pytest tests/test_integration_*.py -v


