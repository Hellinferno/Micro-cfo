name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: microcfo_test
      POSTGRES_USER: microcfo
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: microcfo_test
          POSTGRES_USER: microcfo
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U microcfo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Wait for PostgreSQL to be ready
      run: |
        until pg_isready -h localhost -p 5432 -U microcfo; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
    
    - name: Setup test database
      run: |
        # Create database if it doesn't exist (it should from service config, but ensure it)
        # Note: The postgres service already creates microcfo_test via POSTGRES_DB env var
        echo "Database microcfo_test should already exist from service configuration"
        # Verify database exists
        psql -h localhost -U microcfo -d microcfo_test -c "SELECT 1;" || exit 1
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
    
    - name: Run database migrations
      run: |
        # Run Alembic migrations to set up database schema
        alembic upgrade head || echo "No migrations to run or alembic not configured for test DB"
      env:
        DATABASE_URL: postgresql://microcfo:test_password@localhost:5432/microcfo_test
        ENCRYPTION_KEY: aKiF1eXQY3K_LiplKZKUw5GhjqiqAGKtqxTfRoajKsg=
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql://microcfo:test_password@localhost:5432/microcfo_test
        REDIS_URL: redis://localhost:6379/0
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        JWT_SECRET_KEY: test_jwt_secret_key_for_ci_testing_only
        ENCRYPTION_KEY: aKiF1eXQY3K_LiplKZKUw5GhjqiqAGKtqxTfRoajKsg=
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      POSTGRES_DB: microcfo_test
      POSTGRES_USER: microcfo
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: microcfo_test
          POSTGRES_USER: microcfo
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U microcfo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Wait for PostgreSQL to be ready
      run: |
        until pg_isready -h localhost -p 5432 -U microcfo; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
    
    - name: Setup test database
      run: |
        # Verify database exists
        psql -h localhost -U microcfo -d microcfo_test -c "SELECT 1;" || exit 1
      env:
        PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
    
    - name: Run database migrations
      run: |
        # Run Alembic migrations to set up database schema
        alembic upgrade head || echo "No migrations to run or alembic not configured for test DB"
      env:
        DATABASE_URL: postgresql://microcfo:test_password@localhost:5432/microcfo_test
        ENCRYPTION_KEY: aKiF1eXQY3K_LiplKZKUw5GhjqiqAGKtqxTfRoajKsg=
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://microcfo:test_password@localhost:5432/microcfo_test
        REDIS_URL: redis://localhost:6379/0
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        JWT_SECRET_KEY: test_jwt_secret_key_for_ci_testing_only
        ENCRYPTION_KEY: aKiF1eXQY3K_LiplKZKUw5GhjqiqAGKtqxTfRoajKsg=
      run: |
        pytest tests/test_integration_*.py -v


