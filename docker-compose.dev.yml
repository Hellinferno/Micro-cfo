version: '3.8'

# Development overrides for docker-compose.yml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    volumes:
      - .:/app
      - /app/venv
    environment:
      DEBUG: "true"
    command: uvicorn integration_server:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  # Development tools
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: microcfo-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@microcfo.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - microcfo-network
    depends_on:
      - postgres

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: microcfo-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - microcfo-network
    depends_on:
      - redis
