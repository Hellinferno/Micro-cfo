# Railway Nixpacks configuration
providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "gunicorn src.integration_server:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
