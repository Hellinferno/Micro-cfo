# Render Blueprint - Infrastructure as Code
# Deploy with: Connect repo to Render Dashboard

services:
  # Main FastAPI Backend
  - type: web
    name: microcfo-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.integration_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: "false"
      - key: UV_LINK_MODE
        value: "copy"
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false  # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: microcfo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: microcfo-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        sync: false  # Set after Vercel deployment
    healthCheckPath: /health
    autoDeploy: true

  # Celery Worker (Background Tasks)
  - type: worker
    name: microcfo-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A src.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: UV_LINK_MODE
        value: "copy"
      - key: REDIS_URL
        fromService:
          name: microcfo-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: microcfo-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  # Redis for Celery
  - type: redis
    name: microcfo-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Allow connections only from Render services in this blueprint

databases:
  # PostgreSQL Database
  - name: microcfo-db
    plan: free
    databaseName: microcfo
